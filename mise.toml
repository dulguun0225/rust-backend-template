# mise.lock records every tool below at its exact version, with the download url and a sha256 for each platform in
# `lockfile_platforms`. `mise install` refuses a download whose checksum differs and, under `tool_config.locked`,
# a tool the lock lacks. scripts/check-mise-lock.mjs fails the wall when the lock is out of date with this file or
# an entry lacks a checksum. After moving a pin here, run `mise lock`, then
# `node scripts/check-suppressions.mjs --write`, and commit the three files.
[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]

[tool_config]
locked = true

[tools]
# Exact pins, each checked newest on 2026-09-29. The Rust toolchain itself is rust-toolchain.toml's, read by
# rustup; this file pins what runs beside it. `mise install` installs every entry.
# scripts/*.mjs run on this; Node rather than bash so the wall runs the same on Linux, macOS and Windows.
node = "24.21.0"
# Migration lint (scripts/squawk-changed-migrations.mjs).
"github:sbdchd/squawk" = "2.66.0"
# Source rules: the serde rules under rules/ast-grep (sgconfig.yml).
ast-grep = "0.45.3"
# Secrets in the files git would commit and in the change's commits (scripts/secrets.mjs).
gitleaks = "8.30.1"
# The service image's packages against the vulnerability database (scripts/image-scan.mjs). mise's registry maps
# `trivy` to aqua:aquasecurity/trivy, which checks the archive against the release's checksums file and that
# file's sigstore bundle, signed by trivy's release workflow at the tag. 0.74.0 is outside the 2026-03 supply-chain
# compromise (GHSA-69fq-xp46-6x23: binaries v0.69.4 only) and an immutable GitHub release.
trivy = "0.74.0"
# Advisories, licences, bans, sources (deny.toml).
cargo-deny = "0.20.2"
# Unused dependencies.
"github:Boshen/cargo-shear" = "1.14.0"
# Line, region and function coverage floors.
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
# Mutation testing over the diff.
"github:sourcefrog/cargo-mutants" = "27.1.0"
# Breaking changes to the OpenAPI document against the base branch.
"github:oasdiff/oasdiff" = "1.32.1"
# The OpenAPI ruleset linter (rules/openapi.yaml). mise's registry maps `vacuum` to aqua:daveshanley/vacuum.
vacuum = "0.30.6"
# `sqlx migrate` and `cargo sqlx prepare`; no release binaries exist, so mise builds it with cargo, --locked.
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "postgres,rustls" }
