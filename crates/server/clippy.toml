  { path = "std::thread::sleep", reason = "blocks the executor; use tokio::time::sleep" },
  { path = "std::fs::read", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::read_to_string", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::write", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::read_dir", reason = "blocking file I/O; use tokio::fs" },
