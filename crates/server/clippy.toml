  { path = "std::fs::remove_dir", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::remove_dir_all", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::copy", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::rename", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::metadata", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::symlink_metadata", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::canonicalize", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::exists", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::hard_link", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::read_link", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::set_permissions", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::File::open", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::File::create", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::File::create_new", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::OpenOptions::open", reason = "blocking file I/O; use tokio::fs" },
  { path = "std::fs::DirBuilder::create", reason = "blocking file I/O; use tokio::fs" },
  # Time comes from the injected platform::clock::Clock.
  { path = "std::time::SystemTime::now", reason = "a wall-clock read; take the injected platform::clock::Clock" },
  { path = "std::time::SystemTime::elapsed", reason = "a wall-clock read; take the injected platform::clock::Clock" },
  { path = "time::OffsetDateTime::now_utc", reason = "a wall-clock read; take the injected platform::clock::Clock" },
  { path = "time::UtcDateTime::now", reason = "a wall-clock read; take the injected platform::clock::Clock" },
  { path = "uuid::Timestamp::now", reason = "a wall-clock read; take the injected platform::clock::Clock" },
  # Ids come from platform::ids::new_id.
  { path = "uuid::Uuid::now_v7", reason = "ids come from platform::ids::new_id" },
  { path = "uuid::Uuid::new_v7", reason = "ids come from platform::ids::new_id" },
  # Unchecked SQL: only query!, query_as! and query_scalar! are checked against the migrated schema.
  { path = "sqlx::query", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::query_as", reason = "unchecked SQL; use sqlx::query_as!" },
  { path = "sqlx::query_scalar", reason = "unchecked SQL; use sqlx::query_scalar!" },
  { path = "sqlx::query_with", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::query_as_with", reason = "unchecked SQL; use sqlx::query_as!" },
  { path = "sqlx::query_scalar_with", reason = "unchecked SQL; use sqlx::query_scalar!" },
  { path = "sqlx::raw_sql", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::Executor::execute", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::Executor::execute_many", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::Executor::fetch", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::Executor::fetch_many", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::Executor::fetch_all", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::Executor::fetch_one", reason = "unchecked SQL; use sqlx::query!" },
  { path = "sqlx::Executor::fetch_optional", reason = "unchecked SQL; use sqlx::query!" },
  # Transactions are opened only by db::Tx, the one transaction seam.
  { path = "sqlx::Pool::begin", reason = "transactions are opened by db::Tx only" },
  { path = "sqlx::Pool::begin_with", reason = "transactions are opened by db::Tx only" },
  { path = "sqlx::Pool::try_begin", reason = "transactions are opened by db::Tx only" },
  { path = "sqlx::Pool::acquire", reason = "connections are taken by db::Tx only" },
  { path = "sqlx::Pool::try_acquire", reason = "connections are taken by db::Tx only" },
  { path = "sqlx::Connection::begin", reason = "transactions are opened by db::Tx only" },
  { path = "sqlx::Acquire::begin", reason = "transactions are opened by db::Tx only" },
  { path = "sqlx::Acquire::acquire", reason = "connections are taken by db::Tx only" },
  # A pool made anywhere but db runs a checked query outside any transaction: query!(…).execute(&pool).
  { path = "sqlx::Pool::connect", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::Pool::connect_with", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::Pool::connect_lazy", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::Pool::connect_lazy_with", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::pool::PoolOptions::connect", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::pool::PoolOptions::connect_with", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::pool::PoolOptions::connect_lazy", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::pool::PoolOptions::connect_lazy_with", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::Connection::connect", reason = "the pool is db's; statements run through db::Tx" },
  { path = "sqlx::Connection::connect_with", reason = "the pool is db's; statements run through db::Tx" },
  # A route registered outside OpenApiRouter::routes serves traffic and is missing from the document.
  { path = "axum::Router::route", reason = "register routes with OpenApiRouter::routes(routes!(...))" },
  { path = "axum::Router::route_service", reason = "register routes with OpenApiRouter::routes(routes!(...))" },
  { path = "axum::Router::nest", reason = "register routes with OpenApiRouter::routes(routes!(...))" },
  { path = "axum::Router::nest_service", reason = "register routes with OpenApiRouter::routes(routes!(...))" },
  { path = "axum::Router::merge", reason = "register routes with OpenApiRouter::routes(routes!(...))" },
  { path = "axum::Router::fallback", reason = "unknown routes are answered by web's problem edge" },
  { path = "axum::Router::fallback_service", reason = "unknown routes are answered by web's problem edge" },
  { path = "utoipa_axum::router::OpenApiRouter::route", reason = "register routes with OpenApiRouter::routes(routes!(...))" },
  { path = "utoipa_axum::router::OpenApiRouter::route_service", reason = "register routes with OpenApiRouter::routes(routes!(...))" },
  { path = "utoipa_axum::router::OpenApiRouter::nest_service", reason = "register routes with OpenApiRouter::routes(routes!(...))" },
  { path = "utoipa_axum::router::OpenApiRouter::fallback", reason = "unknown routes are answered by web's problem edge" },
  { path = "utoipa_axum::router::OpenApiRouter::fallback_service", reason = "unknown routes are answered by web's problem edge" },
  # Money: division is written once, in money::mul_div_round; `.sum()` over i64 wraps in release unseen.
  { path = "i64::checked_div", reason = "division is money::mul_div_round's alone" },
  { path = "i64::checked_rem", reason = "division is money::mul_div_round's alone" },
  { path = "i64::div_euclid", reason = "division is money::mul_div_round's alone" },
  { path = "i64::rem_euclid", reason = "division is money::mul_div_round's alone" },
  { path = "i64::checked_div_euclid", reason = "division is money::mul_div_round's alone" },
  { path = "i64::checked_rem_euclid", reason = "division is money::mul_div_round's alone" },
  { path = "i128::checked_div", reason = "division is money::mul_div_round's alone" },
  { path = "i128::checked_rem", reason = "division is money::mul_div_round's alone" },
  { path = "i128::div_euclid", reason = "division is money::mul_div_round's alone" },
  { path = "i128::rem_euclid", reason = "division is money::mul_div_round's alone" },
  { path = "i128::checked_div_euclid", reason = "division is money::mul_div_round's alone" },
  { path = "i128::checked_rem_euclid", reason = "division is money::mul_div_round's alone" },
  { path = "core::iter::Iterator::sum", reason = "wraps silently in release; fold with checked_add" },
  { path = "core::iter::Iterator::product", reason = "wraps silently in release; fold with checked_mul" },
  # anyhow is the server binary's alone.
  { path = "anyhow::Context::with_context", reason = "anyhow is for the server binary's startup only; return a thiserror type" },
  # Request bodies are read by web::body::StrictJson alone.
  { path = "serde_json::from_slice", reason = "request bodies are read by web::body::StrictJson" },
  { path = "serde_json::from_str", reason = "request bodies are read by web::body::StrictJson" },
  { path = "serde_json::from_reader", reason = "request bodies are read by web::body::StrictJson" },
