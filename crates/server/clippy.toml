disallowed-types = [
  { path = "anyhow::Error", reason = "anyhow is for the server binary's startup only; return a thiserror type" },
  { path = "bigdecimal::BigDecimal", reason = "amounts are money::Money; NUMERIC is read and written by money_sql::DbAmount only" },
  { path = "sqlx::AssertSqlSafe", reason = "runtime-built SQL is unchecked; use sqlx::query!" },
  { path = "sqlx::QueryBuilder", reason = "runtime-built SQL is unchecked; use sqlx::query!" },
  { path = "axum::extract::RawForm", reason = "request bodies bind as web::body::StrictJson" },
