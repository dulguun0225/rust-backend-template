# Generated by scripts/clippy-scopes.mjs from the root clippy.toml minus clippy-scopes.toml [server]:
# the binary's startup: anyhow at the edge, as the stack decision allows.
# Do not edit: change the root file or clippy-scopes.toml and run `node scripts/clippy-scopes.mjs --write`.
# The ban list. clippy reads this file for every crate without its own clippy.toml; a crate-local file
# replaces this one, it does not merge with it, so each crate-local file is generated from this one minus the
# exemptions clippy-scopes.toml declares, and scripts/check-lint-config.mjs fails when one differs.
#
# A misspelled path is only a warning, exit 0 even under -D warnings, and a path whose crate is not a
# dependency is ignored without a word. So every entry has a canary in canaries/bans that clippy must reject
# (scripts/check-ban-canaries.mjs), the wall fails on clippy's "does not refer to" warning, and
# `allow-invalid` is refused. One entry per line: the scope generator works line by line.

# #[cfg(test)] code may unwrap, expect, panic and index; the lints stay forbid everywhere else.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# A span guard held across .await attaches the span to whatever the executor polls next.
await-holding-invalid-types = [
  { path = "tracing::span::Entered", reason = "a span guard across .await; use Instrument::instrument" },
  { path = "tracing::span::EnteredSpan", reason = "a span guard across .await; use Instrument::instrument" },
]

disallowed-methods = [
